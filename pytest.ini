[pytest]
testpaths = tests
addopts =
    --cov=exceptions
    --cov=utils
    --cov=config
    --cov=user_manager
    --cov=favorites_manager
    --cov=api_movies
    --cov=api
    --cov=services
    --cov=models
    --cov=log_setup
    --cov=email_config
    --cov=proxy_config
    --cov-report=term-missing
    --cov-fail-under=80
